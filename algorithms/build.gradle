plugins {
    id 'buildlogic.java-application-conventions'
}

group = 'com.a04t.dsa.algo'
version = 'unspecified'

dependencies {
    // NOTE: api only allowed if java plugin applied
    // api project(':common')
    implementation project(':common')
}

application {
    // Define the main class for the application.
    mainClass = 'com.a04t.dsa.algo.Main'
}